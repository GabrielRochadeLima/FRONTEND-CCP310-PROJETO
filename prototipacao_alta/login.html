
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LeituraJá</title>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/output.css">
</head>

<body class="bg-white text-[#25362F] min-h-screen lg:h-screen lg:overflow-hidden" style="font-family: 'DM Sans', sans-serif;">

    <main class="w-full min-h-screen lg:h-screen">

        <div class="flex flex-col lg:flex-row w-full min-h-screen lg:h-full">

            <section class="bg-[#DDEDE4] lg:w-[45%] px-8 py-10 lg:px-16 lg:py-12 flex flex-col">

                <a href="index.html" class="flex items-center gap-3 hover:opacity-80">

                    <svg width="28" height="28" viewBox="0 0 24 24"
                         fill="none" stroke="#246B55" stroke-width="1.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 6C9 4 6 4 3 5v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Z"/>
                        <path d="M12 6v14"/>
                    </svg>

                    <span class="text-[27px] font-bold">
                        LeituraJá
                    </span>

                </a>

                <div class="mt-14 lg:mt-20">

                    <h1 class="text-[28px] lg:text-[32px] font-bold">
                        Um espaço para suas leituras.
                    </h1>

                    <p class="text-[#75837B] text-[15px] mt-4">
                        Guarde seus livros, acompanhe seu progresso e leia mais.
                    </p>

                </div>

                <div class="flex-1 flex items-center justify-center py-10">

                    <img src="assets/ilustracao-livros.svg"
                         alt="Ilustração de livros empilhados e uma planta"
                         class="w-[420px] max-w-full max-h-[320px] object-contain">

                </div>

                <p class="text-[#246B55] font-semibold text-[14px] mt-5">
                    Feito para quem gosta de ler.
                </p>

            </section>

            <section class="lg:w-[55%] flex flex-col justify-center bg-white px-8 py-12 lg:px-20 lg:py-10">

                <div class="w-full max-w-[550px] mx-auto">

                    <h2 class="text-[30px] lg:text-[32px] font-bold">
                        Bem-vindo de volta
                    </h2>

                    <p class="text-[#75837B] text-[15px] mt-2">
                        Entre na sua conta para continuar lendo.
                    </p>

                    <form action="index.html" method="get" class="mt-12">

                        <label for="email" class="block text-[14px] font-semibold mb-2">
                            E-mail
                        </label>

                        <div class="flex items-center gap-3 border border-[#E7EAE5] rounded-xl h-[56px] px-4 focus-within:border-[#246B55]">

                            <svg width="19" height="19" viewBox="0 0 24 24"
                                 fill="none" stroke="#75837B" stroke-width="1.7"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="m3 7 9 7 9-7"/>
                            </svg>

                            <input type="email" id="email"
                                   placeholder="seuemail@exemplo.com"
                                   class="w-full outline-none bg-transparent text-[14px] placeholder:text-[#75837B]">

                        </div>

                        <label for="senha" class="block text-[14px] font-semibold mt-8 mb-2">
                            Senha
                        </label>

                        <div class="flex items-center gap-3 border border-[#E7EAE5] rounded-xl h-[56px] px-4 focus-within:border-[#246B55]">

                            <svg width="19" height="19" viewBox="0 0 24 24"
                                 fill="none" stroke="#75837B" stroke-width="1.7"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <rect x="5" y="10" width="14" height="11" rx="2"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            </svg>

                            <input type="password" id="senha"
                                   placeholder="••••••••"
                                   class="w-full outline-none bg-transparent text-[14px] placeholder:text-[#75837B]">

                            <svg width="20" height="20" viewBox="0 0 24 24"
                                 fill="none" stroke="#75837B" stroke-width="1.7"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s4-6 10-6 10 6 10 6-4 6-10 6S2 12 2 12Z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>

                        </div>

                        <div class="text-right mt-5">

                            <a href="login.html"
                               class="text-[#246B55] text-[13px] font-semibold hover:underline">
                                Esqueci minha senha
                            </a>

                        </div>

                        <button type="submit"
                                class="bg-[#246B55] text-white w-full h-[55px] rounded-xl font-semibold text-[15px] mt-10 hover:bg-[#183F34] cursor-pointer">
                            Entrar
                        </button>

                    </form>

                    <div class="flex items-center justify-center gap-8 mt-12">

                        <p class="text-[#75837B] text-[14px]">
                            Ainda não tem uma conta?
                        </p>

                        <a href="login.html"
                           class="text-[#246B55] text-[14px] font-semibold hover:underline">
                            Cadastre-se
                        </a>

                    </div>

                </div>

                <p class="text-[#75837B] text-[12px] mt-16 lg:mt-20 max-w-[550px] w-full mx-auto">
                    LeituraJá © 2026
                </p>

            </section>

        </div>

    </main>

</body>

</html>
