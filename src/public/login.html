<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LeituraJá</title>
        <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/autenticacao.css">
        <script src="js/login.js" defer></script>
</head>
<body>
    <header class="cabecalho-publico"><div class="largura"><a class="logo" href="login.html"><svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5v14M12 6.5C9.5 4.5 5.5 4 2.5 5v13.5C6.5 17.3 10 18 12 20.5c2-2.5 5.5-3.2 9.5-2V5C18.5 4 14.5 4.5 12 6.5Z"/></svg><span>LeituraJá</span></a></div></header>
    <main class="autenticacao-area largura">
        <section class="cartao-autenticacao" aria-label="Entrar no LeituraJá">
            <div class="lateral-autenticacao"><img src="img/ilustracao-livros.svg" alt="Livros empilhados"><h1>Sua próxima leitura começa aqui.</h1><p>Organize seus livros, acompanhe seu progresso e alcance suas metas de leitura.</p></div>
            <div class="formulario-autenticacao"><h2>Bem-vindo de volta!</h2><p class="descricao">Entre na sua conta para continuar sua leitura.</p>
                <form id="formulario-login">
                    <div class="grupo-campo"><label class="rotulo" for="email">E-mail</label><input class="campo" type="email" id="email" autocomplete="email" placeholder="seuemail@exemplo.com" required></div>
                    <div class="grupo-campo"><label class="rotulo" for="senha">Senha</label><input class="campo" type="password" id="senha" autocomplete="current-password" placeholder="Digite sua senha" required></div>
                    <p class="erro" id="mensagem-login" role="alert"></p><button class="botao-principal" type="submit">Entrar</button>
                </form>
                <p class="rodape-autenticacao">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </div>
        </section>
    </main>

</body>
</html>
