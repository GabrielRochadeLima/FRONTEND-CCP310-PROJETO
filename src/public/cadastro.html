<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | LeituraJá</title>
        <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/autenticacao.css">
        <script src="js/cadastro.js" defer></script>
</head>
<body>
    <header class="cabecalho-publico"><div class="largura"><a class="logo" href="login.html"><svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5v14M12 6.5C9.5 4.5 5.5 4 2.5 5v13.5C6.5 17.3 10 18 12 20.5c2-2.5 5.5-3.2 9.5-2V5C18.5 4 14.5 4.5 12 6.5Z"/></svg><span>LeituraJá</span></a></div></header>
    <main class="autenticacao-area largura"><section class="cartao-autenticacao cartao-cadastro"><div class="formulario-autenticacao">
        <h2>Criar conta</h2><p class="descricao">Comece a organizar suas leituras no LeituraJá.</p>
        <form id="formulario-cadastro">
            <div class="grupo-campo"><label class="rotulo" for="nome">Nome</label><input class="campo" id="nome" type="text" autocomplete="name" maxlength="100" required></div>
            <div class="grupo-campo"><label class="rotulo" for="email">E-mail</label><input class="campo" id="email" type="email" autocomplete="email" required></div>
            <div class="grupo-campo"><label class="rotulo" for="senha">Senha</label><input class="campo" id="senha" type="password" autocomplete="new-password" minlength="8" required></div>
            <div class="grupo-campo"><label class="rotulo" for="confirmar-senha">Confirmar senha</label><input class="campo" id="confirmar-senha" type="password" autocomplete="new-password" minlength="8" required></div>
            <p id="mensagem-cadastro" class="erro" role="alert"></p><button class="botao-principal" type="submit">Criar conta</button>
        </form><p class="rodape-autenticacao">Já tem uma conta? <a href="login.html">Fazer login</a></p>
    </div></section></main>

</body>
</html>
