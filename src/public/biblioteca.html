<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca | LeituraJá</title>
        <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/interface.css">
    <link rel="stylesheet" href="css/biblioteca.css">
        <script src="js/perfil.js" defer></script>
    <script src="js/comum.js" defer></script>
    <script src="js/biblioteca.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-conteudo largura">
            <a class="logo" href="index.html" aria-label="LeituraJá - Início"><svg xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5v14M12 6.5C9.5 4.5 5.5 4 2.5 5v13.5C6.5 17.3 10 18 12 20.5c2-2.5 5.5-3.2 9.5-2V5C18.5 4 14.5 4.5 12 6.5Z"/></svg><span>LeituraJá</span></a>
            <nav class="links-principais" aria-label="Páginas do sistema"><a href="index.html" class="">Início</a>
    <a href="biblioteca.html" class="ativo">Minha Biblioteca</a>
    <a href="metas.html" class="">Metas</a></nav>
            <div class="acoes-cabecalho">
                <form id="formulario-busca-global" class="busca-cabecalho" role="search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="pesquisa-cabecalho" type="search" aria-label="Buscar livros" placeholder="Buscar livros..."></form>
                <button class="botao-icone-cabecalho" type="button" id="botao-busca-movel" aria-label="Buscar livros"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></button>
                <div class="perfil">
                    <button id="botao-perfil" class="botao-perfil" type="button" aria-label="Menu de perfil e sair" aria-expanded="false" aria-controls="menu-perfil"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></button>
                    <div id="menu-perfil" class="menu-perfil" hidden>
                        <p id="nome-usuario">Minha conta</p>
                        <p id="email-usuario"></p>
                        <button id="botao-sair" type="button">Sair da conta</button>
                    </div>
                </div>
            </div>
        </div>
    </header>
    <main class="conteudo largura">
        <section class="cabecalho-pagina">
            <div><h1>Minha Biblioteca</h1><p class="subtitulo-pagina">Organize os livros que você quer ler, está lendo ou já terminou.</p></div>
            <button id="botao-adicionar" class="botao-principal" type="button">+ Adicionar livro</button>
        </section>
        <section class="ferramentas-biblioteca"><div class="busca-biblioteca">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
            <input id="pesquisa-livros" class="campo" type="search" placeholder="Buscar título ou autor..." aria-label="Pesquisar na biblioteca">
        </div></section>
        <div class="lista-filtros" aria-label="Filtrar pela situação do livro">
            <button type="button" class="filtro ativo" data-status="Todos">Todos</button>
            <button type="button" class="filtro" data-status="Quero ler">Quero ler</button>
            <button type="button" class="filtro" data-status="Lendo">Lendo</button>
            <button type="button" class="filtro" data-status="Lido">Lidos</button>
        </div>
        <section>
            <div class="linha-titulo"><h2 class="titulo-secao">Meus livros</h2><span id="quantidade-livros" class="subtitulo-pagina">0 livros</span></div>
            <div id="lista-livros" class="grade-biblioteca"><p class="estado-vazio">Carregando...</p></div>
        </section>
    </main>
    <div id="janela-livro" class="janela-modal" role="dialog" aria-modal="true" aria-labelledby="titulo-formulario" hidden>
        <div class="modal-conteudo">
            <div class="modal-topo"><h2 id="titulo-formulario">Adicionar livro</h2><button id="botao-fechar" class="botao-fechar" type="button" aria-label="Fechar">×</button></div>
            <form id="formulario-livro">
                <input id="livro-id" type="hidden">
                <div class="grupo-campo"><label class="rotulo" for="livro-titulo">Título</label><input class="campo" id="livro-titulo" type="text" maxlength="200" required></div>
                <div class="grupo-campo"><label class="rotulo" for="livro-autor">Autor</label><input class="campo" id="livro-autor" type="text" maxlength="150" required></div>
                <div class="grupo-campo"><label class="rotulo" for="livro-status">Situação da leitura</label><select class="campo" id="livro-status"><option value="Quero ler">Quero ler</option><option value="Lendo">Lendo</option><option value="Lido">Lido</option></select></div>
                <div class="grupo-campo"><label class="rotulo" for="livro-total-paginas">Total de páginas</label><input class="campo" id="livro-total-paginas" type="number" min="1" required></div>
                <div class="grupo-campo"><label class="rotulo" for="livro-pagina-atual">Página atual</label><input class="campo" id="livro-pagina-atual" type="number" min="0" value="0" required></div>
                <p id="mensagem-formulario" class="erro" role="alert"></p>
                <div class="modal-rodape"><button id="botao-cancelar" class="botao-suave" type="button">Cancelar</button><button type="submit" class="botao-principal">Salvar livro</button></div>
            </form>
        </div>
    </div>
    <nav class="navegacao-movel" aria-label="Navegação no celular"><a class="" href="index.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3Z"/></svg><span>Início</span></a><a class="" href="biblioteca.html"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18V5a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4a2 2 0 0 1 2 2v13h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3H3Z"/></svg><span>Biblioteca</span></a><a class="" href="metas.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span>Metas</span></a></nav>
</body>
</html>
