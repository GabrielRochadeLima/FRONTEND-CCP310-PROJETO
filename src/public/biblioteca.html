<!DOCTYPE html>
<html lang="pt-BR">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Minha Biblioteca | LeituraJá
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
  <link href="css/estilo.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="cabecalho-site">
   <div class="cabecalho-conteudo">
    <a class="marca" href="index.html">
     Leitura
     <span>
      Já
     </span>
    </a>
    <nav aria-label="Navegação principal" class="navegacao-desktop">
     <a href="index.html">
      Início
     </a>
     <a class="ativo" href="biblioteca.html">
      Biblioteca
     </a>
     <a href="metas.html">
      Metas
     </a>
    </nav>
    <div class="perfil-area">
     <button aria-controls="menu-perfil" aria-expanded="false" aria-label="Abrir opções da conta" class="botao-perfil" id="botao-perfil" type="button">
      <svg aria-hidden="true" fill="none" height="21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="21">
       <circle cx="12" cy="8" r="4">
       </circle>
       <path d="M4 21a8 8 0 0 1 16 0">
       </path>
      </svg>
      <span class="nome-usuario" id="nome-usuario">
       Minha conta
      </span>
      <span aria-hidden="true">
       ⌄
      </span>
     </button>
     <div class="menu-perfil hidden" id="menu-perfil">
      <p class="email-usuario" id="email-usuario">
      </p>
      <button id="botao-sair" type="button">
       Sair da conta
      </button>
     </div>
    </div>
   </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-7 md:py-10">
   <section class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-7">
    <div>
     <h1 class="text-3xl font-extrabold mb-2">
      Minha Biblioteca
     </h1>
     <p class="text-[#75837B]">
      Todos os seus livros, em um só lugar.
     </p>
    </div>
    <button class="bg-[#246B55] text-white rounded-xl px-5 py-3 font-bold cursor-pointer" id="botao-adicionar">
     + Adicionar livro
    </button>
   </section>
   <section class="cartao p-4 md:p-5 mb-7">
    <input aria-label="Pesquisar livros" class="w-full px-4 py-3 rounded-xl border border-[#E7EAE5] mb-4 outline-none focus:border-[#246B55]" id="pesquisa-livros" placeholder="Buscar por título ou autor..." type="search"/>
    <div class="flex flex-wrap gap-2">
     <button class="filtro px-4 py-2 rounded-full bg-[#246B55] text-white text-sm font-bold cursor-pointer" data-status="Todos">
      Todos
     </button>
     <button class="filtro px-4 py-2 rounded-full bg-gray-100 text-sm cursor-pointer" data-status="Quero ler">
      Quero ler
     </button>
     <button class="filtro px-4 py-2 rounded-full bg-gray-100 text-sm cursor-pointer" data-status="Lendo">
      Lendo
     </button>
     <button class="filtro px-4 py-2 rounded-full bg-gray-100 text-sm cursor-pointer" data-status="Lido">
      Lido
     </button>
    </div>
   </section>
   <section>
    <div class="flex items-center justify-between mb-4">
     <h2 class="text-xl font-extrabold">
      Meus livros
     </h2>
     <span class="text-[#75837B] text-sm" id="quantidade-livros">
      0 livros
     </span>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4" id="lista-livros">
     <p class="text-[#75837B]">
      Carregando livros...
     </p>
    </div>
   </section>
   <div class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center p-4" id="janela-livro">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
     <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-extrabold" id="titulo-formulario">
       Adicionar livro
      </h2>
      <button aria-label="Fechar" class="text-2xl cursor-pointer" id="botao-fechar" type="button">
       ×
      </button>
     </div>
     <form class="space-y-4" id="formulario-livro">
      <input id="livro-id" type="hidden"/>
      <label class="block text-sm font-semibold">
       Título
       <input class="block mt-2 w-full rounded-lg border border-[#E7EAE5] px-4 py-3" id="livro-titulo" maxlength="200" required=""/>
      </label>
      <label class="block text-sm font-semibold">
       Autor
       <input class="block mt-2 w-full rounded-lg border border-[#E7EAE5] px-4 py-3" id="livro-autor" maxlength="150" required=""/>
      </label>
      <label class="block text-sm font-semibold">
       Situação
       <select class="block mt-2 w-full rounded-lg border border-[#E7EAE5] px-4 py-3" id="livro-status">
        <option>
         Quero ler
        </option>
        <option>
         Lendo
        </option>
        <option>
         Lido
        </option>
       </select>
      </label>
      <label class="block text-sm font-semibold">
       Total de páginas
       <input class="block mt-2 w-full rounded-lg border border-[#E7EAE5] px-4 py-3" id="livro-total-paginas" min="1" required="" type="number"/>
      </label>
      <label class="block text-sm font-semibold">
       Página atual
       <input class="block mt-2 w-full rounded-lg border border-[#E7EAE5] px-4 py-3" id="livro-pagina-atual" min="0" required="" type="number" value="0"/>
      </label>
      <p class="text-sm text-red-600" id="mensagem-formulario" role="alert">
      </p>
      <div class="flex justify-end gap-3">
       <button class="rounded-lg bg-gray-100 px-5 py-3 cursor-pointer" id="botao-cancelar" type="button">
        Cancelar
       </button>
       <button class="rounded-lg bg-[#246B55] text-white px-5 py-3 font-bold cursor-pointer" type="submit">
        Salvar livro
       </button>
      </div>
     </form>
    </div>
   </div>
  </main>
  <script src="js/biblioteca.js">
  </script>
  <nav aria-label="Navegação no celular" class="navegacao-movel">
   <a href="index.html">
    <svg aria-hidden="true" fill="none" height="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="23">
     <path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z">
     </path>
    </svg>
    <span>
     Início
    </span>
   </a>
   <a class="ativo" href="biblioteca.html">
    <svg aria-hidden="true" fill="none" height="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="23">
     <path d="M12 7v14">
     </path>
     <path d="M3 18V5a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3 3 3 0 0 1 3-3h4a2 2 0 0 1 2 2v13h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3H3Z">
     </path>
    </svg>
    <span>
     Biblioteca
    </span>
   </a>
   <a href="metas.html">
    <svg aria-hidden="true" fill="none" height="23" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24" width="23">
     <circle cx="12" cy="12" r="9">
     </circle>
     <circle cx="12" cy="12" r="5">
     </circle>
     <circle cx="12" cy="12" r="1">
     </circle>
    </svg>
    <span>
     Metas
    </span>
   </a>
  </nav>
  <script src="js/perfil.js">
  </script>
 </body>
</html>
